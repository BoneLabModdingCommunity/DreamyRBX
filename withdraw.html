<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Withdraw</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle,#8b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#19002b);

color:white;

}


.box{

width:650px;

padding:45px;

background:#111;

border-radius:35px;

box-shadow:0 0 60px #8b00ff55;

text-align:center;

}



.logo{

font-size:38px;

font-weight:900;

display:flex;

align-items:center;

justify-content:center;

gap:15px;

}


.logo img{

width:70px;

}



.balance{

margin-top:30px;

padding:30px;

border-radius:25px;

background:linear-gradient(
135deg,
#8500ff,
#420080
);

font-size:40px;

font-weight:900;

}



input{

width:100%;

margin-top:20px;

padding:18px;

background:#050505;

border:1px solid #333;

border-radius:15px;

color:white;

font-size:18px;

}



button{

width:100%;

padding:18px;

margin-top:20px;

border:0;

border-radius:15px;

background:linear-gradient(
90deg,#8b00ff,#d05cff
);

color:white;

font-weight:900;

font-size:18px;

cursor:pointer;

}



.back{

background:#222;

}



#error{

color:#ff7777;

margin-top:20px;

}



#success{

color:#c77dff;

margin-top:20px;

font-weight:900;

display:none;

}



</style>

</head>


<body>


<div class="box">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<h2>
Withdraw
</h2>



<div class="balance">

💰
<span id="balance">
0
</span>
RBX

</div>




<input
id="amount"
type="number"
placeholder="Amount of RBX">



<input
id="gamepass"
placeholder="Roblox Gamepass Link">



<button onclick="withdraw()">

💸 Withdraw

</button>



<button class="back" onclick="location.href='dashboard.html'">

← Dashboard

</button>



<div id="error"></div>


<div id="success">

Thanks For Using Dreamy RBX! 💜

</div>



</div>







<script>


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// PUT YOUR WEBHOOK HERE
const WEBHOOK = "https://discord.com/api/webhooks/1529411552795426988/guIc9yzIqomsnZzSbeaH1m_bXsvhjn4UhcUC4jHkyhGGuaGbGfG67olSECqaUprdJtUH";




let user =
JSON.parse(
localStorage.getItem("dreamy_user")
);



if(!user){

location.href="index.html";

}




let currentBalance=0;





async function loadBalance(){



let {data,error}=await db

.from("users")

.select("balance")

.eq("username",user.username)

.single();




if(error){

console.log(error);

return;

}



currentBalance=data.balance;



document.getElementById("balance").innerHTML =
currentBalance;



}





async function withdraw(){



let amount =
Number(
document.getElementById("amount").value
);



let gamepass =
document.getElementById("gamepass").value.trim();




let error =
document.getElementById("error");



error.innerHTML="";



if(amount <=0){

error.innerHTML="Enter a valid amount";

return;

}



if(amount > currentBalance){

error.innerHTML="You don't have enough RBX";

return;

}



if(!gamepass.includes("roblox.com")){

error.innerHTML="Enter a valid Roblox gamepass link";

return;

}





let newBalance =
currentBalance - amount;





await db

.from("users")

.update({

balance:newBalance

})

.eq("username",user.username);







// Discord notification

if(WEBHOOK !== ""){


fetch(WEBHOOK,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

embeds:[{

title:"💸 Dreamy RBX Withdraw",

fields:[

{

name:"Username",

value:user.username

},

{

name:"Amount",

value:amount+" RBX"

},

{

name:"Gamepass",

value:gamepass

}

]

}]

})

});


}





currentBalance=newBalance;


document.getElementById("balance").innerHTML =
currentBalance;



document.getElementById("success").style.display =
"block";


}




loadBalance();


</script>


</body>

</html>
