<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Withdraw</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}

body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

display:flex;
align-items:center;
justify-content:center;

color:white;

}


.box{

width:650px;

padding:45px;

background:#111111dd;

border-radius:35px;

border:1px solid #ffffff15;

box-shadow:0 0 60px #8b00ff40;

text-align:center;

}



.logo{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

font-size:35px;

font-weight:900;

}



.logo img{

width:65px;

}



.balance{

margin-top:30px;

padding:30px;

border-radius:25px;

background:linear-gradient(
135deg,
#8500ff,
#420080
);

}



.balance img{

width:45px;

vertical-align:middle;

}



.amount{

font-size:50px;

font-weight:900;

}




input{

width:100%;

margin-top:20px;

padding:18px;

border-radius:15px;

background:#080808;

border:1px solid #333;

color:white;

font-size:18px;

outline:none;

}



button{

width:100%;

margin-top:20px;

padding:18px;

border:0;

border-radius:15px;

background:linear-gradient(
90deg,
#8b00ff,
#d05cff
);

color:white;

font-size:18px;

font-weight:900;

cursor:pointer;

}



button:hover{

transform:scale(1.03);

}



.back{

background:#222;

}



#error{

margin-top:20px;

color:#ff7070;

}



.success{

display:none;

margin-top:25px;

font-size:25px;

font-weight:900;

color:#c77dff;

}

</style>

</head>


<body>


<div class="box">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<div class="balance">

<div>
YOUR BALANCE
</div>


<div class="amount">

<img src="https://i.imgur.com/18anndb.png">

<span id="balance">
0
</span>

</div>


</div>



<h2>
💸 Withdraw RBX
</h2>



<input
id="amount"
type="number"
placeholder="Amount of RBX">



<input
id="gamepass"
placeholder="Roblox Gamepass Link">



<button onclick="withdraw()">

Withdraw

</button>



<button class="back" onclick="location.href='dashboard.html'">

← Back Dashboard

</button>



<div id="error"></div>


<div id="success" class="success">

Thanks For Using Dreamy RBX! 💜

</div>



</div>





<script>


// PUT YOUR WEBHOOK HERE
const WEBHOOK = "https://discord.com/api/webhooks/1529411552795426988/guIc9yzIqomsnZzSbeaH1m_bXsvhjn4UhcUC4jHkyhGGuaGbGfG67olSECqaUprdJtUH";



let balance =
Number(localStorage.getItem("dreamy_balance") || 0);



document.getElementById("balance").innerHTML =
balance;





async function withdraw(){



let amount =
Number(document.getElementById("amount").value);



let gamepass =
document.getElementById("gamepass").value.trim();



let error =
document.getElementById("error");



error.innerHTML="";





if(!amount || amount <= 0){

error.innerHTML="Enter a valid amount.";

return;

}



if(amount > balance){

error.innerHTML="You don't have enough RBX.";

return;

}



if(!gamepass.includes("roblox.com")){

error.innerHTML="Enter a valid Roblox gamepass link.";

return;

}





// SEND TO DISCORD

if(WEBHOOK !== ""){


await fetch(WEBHOOK,{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

embeds:[{

title:"💸 Dreamy RBX Withdraw",

color:10181046,


fields:[

{

name:"👤 Username",

value:
JSON.parse(
localStorage.getItem("dreamy_user")
).username

},

{

name:"💰 Amount",

value:
amount+" RBX"

},

{

name:"🎮 Gamepass",

value:gamepass

}

]

}]

})

});


}





// REMOVE BALANCE


balance -= amount;


localStorage.setItem(
"dreamy_balance",
balance
);



document.getElementById("balance").innerHTML =
balance;



document.getElementById("success").style.display =
"block";


document.getElementById("amount").value="";

document.getElementById("gamepass").value="";



}



</script>


</body>

</html>
