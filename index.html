<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

color:white;

}



.box{

width:600px;

padding:50px;

background:#111111dd;

border-radius:35px;

text-align:center;

box-shadow:0 0 60px #8b00ff50;

}



.logo{

font-size:40px;

font-weight:900;

display:flex;

align-items:center;

justify-content:center;

gap:15px;

}



.logo img{

width:70px;

}



p{

color:#aaa;

font-size:18px;

}



input{

width:100%;

padding:20px;

margin-top:25px;

border-radius:15px;

border:1px solid #333;

background:#080808;

color:white;

font-size:20px;

}



button{

width:100%;

margin-top:25px;

padding:20px;

border:0;

border-radius:15px;

background:

linear-gradient(
90deg,
#8b00ff,
#d05cff
);

color:white;

font-size:20px;

font-weight:900;

cursor:pointer;

}



#error{

margin-top:20px;

color:#ff7777;

}



</style>

</head>


<body>


<div class="box">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<h1>
Welcome
</h1>


<p>
Enter your Roblox username
</p>



<input

id="username"

placeholder="Roblox Username">



<button onclick="login()">

Continue

</button>



<div id="error"></div>



</div>







<script>


const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);






async function login(){


let username =
document.getElementById("username").value.trim();



let error =
document.getElementById("error");



error.innerHTML="";



if(!username){

error.innerHTML=
"Enter a username";

return;

}





// Roblox avatar API

let avatar =
"https://www.roblox.com/headshot-thumbnail/image?userId=1&width=420&height=420&format=png";





// Check user


let {data,error:dbError}=await client

.from("users")

.select("*")

.eq("username",username)

.single();







// Create new user


if(!data){



let insert =
await client

.from("users")

.insert({

username:username,

avatar:avatar,

balance:0

})

.select()
.single();



data=insert.data;


}







localStorage.setItem(

"dreamy_user",

JSON.stringify(data)

);




location.href="dashboard.html";



}




</script>


</body>

</html>
