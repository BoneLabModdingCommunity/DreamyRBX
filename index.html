<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');


*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:
radial-gradient(circle,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#19002b);

color:white;

}


.box{

width:600px;

padding:50px;

background:#111;

border-radius:35px;

box-shadow:0 0 60px #8b00ff55;

text-align:center;

}



.logo{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

font-size:40px;

font-weight:900;

}


.logo img{

width:70px;

}



input{

margin-top:30px;

width:100%;

padding:20px;

border-radius:15px;

border:1px solid #333;

background:#050505;

color:white;

font-size:20px;

}



button{

margin-top:25px;

width:100%;

padding:20px;

border:0;

border-radius:15px;

background:linear-gradient(
90deg,
#8b00ff,
#d05cff
);

color:white;

font-size:20px;

font-weight:900;

cursor:pointer;

}



button:hover{

transform:scale(1.03);

}



#error{

margin-top:20px;

color:#ff7777;

}



</style>

</head>



<body>



<div class="box">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<h1>
Login
</h1>


<p>
Enter your Roblox username
</p>



<input
id="username"
placeholder="Roblox Username">



<button onclick="login()">

Continue

</button>



<div id="error"></div>



</div>









<script>


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





async function login(){



let username =
document.getElementById("username").value.trim();



let error =
document.getElementById("error");



error.innerHTML="";



if(!username){

error.innerHTML="Enter a Roblox username";

return;

}





try{


// Ask our Vercel API instead of Roblox directly

let response =
await fetch("/api/roblox",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:username

})

});




let roblox =
await response.json();




if(!response.ok){

error.innerHTML =
"Roblox user not found";

return;

}





// Check if user already exists


let {data}=await db

.from("users")

.select("*")

.eq("username",roblox.username)

.single();








// Create account if new

if(!data){


let result =
await db

.from("users")

.insert({

username:roblox.username,

avatar:roblox.avatar,

balance:0

})

.select()
.single();



data=result.data;


}





localStorage.setItem(

"dreamy_user",

JSON.stringify(data)

);





window.location.href="dashboard.html";





}

catch(e){


console.log(e);


error.innerHTML=
"Something went wrong";


}



}



</script>



</body>

</html>
