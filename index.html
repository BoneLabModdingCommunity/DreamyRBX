<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

*{
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    margin:0;
    height:100vh;

    background:
    radial-gradient(circle at top,#8b00ff55,transparent 40%),
    linear-gradient(135deg,#080808,#19002b);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
}


.card{

    width:430px;
    padding:40px;

    background:rgba(20,20,25,.9);
    backdrop-filter:blur(20px);

    border:1px solid #ffffff12;
    border-radius:25px;

    box-shadow:0 20px 70px black;

}


.logo{

    display:flex;
    align-items:center;
    gap:15px;

}


.logo img{

    width:65px;
    height:65px;
    object-fit:contain;

}


.logo h1{

    margin:0;
    font-size:32px;

}


.logo span{

    color:#b65cff;

}


.desc{

    color:#aaa;
    line-height:1.5;
    margin-top:25px;

}


input{

    width:100%;
    margin-top:20px;

    padding:16px;

    border-radius:14px;

    background:#101010;

    color:white;

    border:1px solid #333;

    font-size:16px;

    outline:none;

}


button{

    width:100%;

    margin-top:20px;

    padding:16px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    background:linear-gradient(
    90deg,#8000ff,#c65cff);

    color:white;

    font-weight:bold;

    font-size:16px;

}


button:hover{

    opacity:.85;

}


.profile{

    display:none;

    margin-top:20px;

    padding:15px;

    background:#111;

    border-radius:15px;

    align-items:center;

    gap:15px;

}


.profile img{

    width:70px;
    height:70px;

    border-radius:50%;

}


#error{

    color:#ff6b6b;

    margin-top:15px;

    word-break:break-word;

}

</style>

</head>


<body>


<div class="card">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

<h1>
Dreamy <span>RBX</span>
</h1>

</div>


<p class="desc">

Enter your Roblox username.

<br>

No password required.

</p>



<input id="username" placeholder="Roblox Username">



<button onclick="login()">

Continue →

</button>



<div class="profile" id="profile">

<img id="avatar">

<div>

<b id="player"></b>

<br>

<span style="color:#aaa">
Loading...
</span>

</div>

</div>



<p id="error"></p>


</div>





<script>


async function login(){


const username =
document.getElementById("username").value.trim();


const error =
document.getElementById("error");



if(!username){

error.innerHTML="Enter a Roblox username";

return;

}



error.innerHTML="Checking...";



try{


const response = await fetch(
"/api/roblox",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:username

})

});



const text = await response.text();



let data;



try{

data = JSON.parse(text);

}

catch{

throw new Error(
"API returned: " + text
);

}



if(!response.ok){

throw new Error(
data.error || "API error"
);

}



document.getElementById("avatar").src =
data.avatar;


document.getElementById("player").innerHTML =
data.username;


document.getElementById("profile").style.display =
"flex";



localStorage.setItem(
"dreamy_user",
JSON.stringify({

id:data.id,

username:data.username,

avatar:data.avatar

})
);



if(!localStorage.getItem("dreamy_balance")){

localStorage.setItem(
"dreamy_balance",
"0"
);

}



setTimeout(()=>{

window.location.href="dashboard.html";

},1000);



}

catch(err){

console.error(err);

error.innerHTML =
"❌ " + err.message;

}



}


</script>


</body>

</html>
