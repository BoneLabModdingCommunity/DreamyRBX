<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}

body{

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle,#8b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#19002b);

color:white;

}


.box{

width:600px;

padding:50px;

background:#111;

border-radius:35px;

box-shadow:0 0 60px #8b00ff55;

text-align:center;

}



.logo{

font-size:40px;

font-weight:900;

display:flex;

justify-content:center;

align-items:center;

gap:15px;

}


.logo img{

width:70px;

}



input{

margin-top:30px;

width:100%;

padding:20px;

font-size:20px;

border-radius:15px;

background:#050505;

border:1px solid #333;

color:white;

}



button{

margin-top:25px;

width:100%;

padding:20px;

border:0;

border-radius:15px;

font-size:20px;

font-weight:900;

background:linear-gradient(
90deg,#8b00ff,#d05cff
);

color:white;

cursor:pointer;

}



#error{

margin-top:20px;

color:#ff7777;

}


</style>


</head>


<body>


<div class="box">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>


<h1>
Login
</h1>


<p>
Enter your Roblox username
</p>


<input
id="username"
placeholder="Roblox Username">


<button onclick="login()">

Continue

</button>


<div id="error"></div>


</div>





<script>


const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




async function getRobloxUser(username){


let response =
await fetch(
"https://users.roblox.com/v1/usernames/users",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

usernames:[username],

excludeBannedUsers:true

})

});



let data =
await response.json();



if(!data.data || data.data.length === 0){

return null;

}



return data.data[0];

}





async function getAvatar(id){


let r =
await fetch(

`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=420x420&format=Png`

);


let data =
await r.json();


return data.data[0].imageUrl;


}





async function login(){


let username =
document.getElementById("username").value.trim();



let error =
document.getElementById("error");


error.innerHTML="";



if(!username){

error.innerHTML="Enter a username";

return;

}



let roblox =
await getRobloxUser(username);



if(!roblox){

error.innerHTML="Roblox user not found";

return;

}




let avatar =
await getAvatar(
roblox.id
);






let {data}=await client

.from("users")

.select("*")

.eq("username",roblox.name)

.single();







if(!data){


let result =
await client

.from("users")

.insert({

username:roblox.name,

avatar:avatar,

balance:0

})

.select()
.single();


data=result.data;


}






localStorage.setItem(

"dreamy_user",

JSON.stringify(data)

);



location.href="dashboard.html";



}



</script>


</body>

</html>
