<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');


*{
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}


body{

    margin:0;
    height:100vh;

    background:
    radial-gradient(circle at top,#8b00ff55,transparent 40%),
    linear-gradient(135deg,#080808,#19002b);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

}



.glow{

    position:absolute;
    width:450px;
    height:450px;

    background:#9b00ff;

    filter:blur(160px);

    opacity:.25;

}




.card{

    width:430px;

    padding:40px;

    background:rgba(20,20,25,.9);

    backdrop-filter:blur(20px);

    border:1px solid #ffffff12;

    border-radius:25px;

    box-shadow:0 20px 70px black;

    position:relative;

}




.logo{

    display:flex;

    align-items:center;

    gap:15px;

}



.logo img{

    width:65px;

    height:65px;

    object-fit:contain;

}



.logo h1{

    margin:0;

    font-size:32px;

    font-weight:800;

}



.logo span{

    color:#b65cff;

}



.desc{

    margin-top:25px;

    color:#aaa;

    line-height:1.5;

}



input{

    width:100%;

    padding:16px;

    margin-top:20px;

    background:#101010;

    border:1px solid #333;

    color:white;

    border-radius:14px;

    font-size:16px;

    outline:none;

}



input:focus{

    border-color:#a855ff;

}



button{

    width:100%;

    padding:16px;

    margin-top:20px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    background:linear-gradient(
    90deg,
    #8000ff,
    #c65cff
    );

    color:white;

    font-size:16px;

    font-weight:bold;

}



button:hover{

    opacity:.85;

}



.preview{

    display:none;

    margin-top:20px;

    padding:15px;

    background:#111;

    border-radius:15px;

    align-items:center;

    gap:15px;

}



.preview img{

    width:70px;

    height:70px;

    border-radius:50%;

}



#error{

    color:#ff6b6b;

    margin-top:15px;

}



.footer{

    text-align:center;

    color:#666;

    font-size:12px;

    margin-top:25px;

}


</style>

</head>


<body>


<div class="glow"></div>



<div class="card">



<div class="logo">

<img src="https://i.imgur.com/18anndb.png">


<h1>
Dreamy <span>RBX</span>
</h1>

</div>




<p class="desc">

Enter your Roblox username to start earning points.

<br>

No password required.

</p>




<input 
id="username"
placeholder="Roblox Username"
>



<button onclick="login()">

Continue →

</button>




<div class="preview" id="preview">


<img id="avatar">


<div>

<b id="player"></b>

<br>

<span style="color:#aaa">
Loading profile...
</span>


</div>


</div>



<p id="error"></p>



<div class="footer">

Dreamy RBX • Fan rewards project

</div>



</div>







<script>


async function login(){


let username =
document.getElementById("username").value.trim();



let error =
document.getElementById("error");



if(!username){

error.innerHTML="Enter your Roblox username";

return;

}



error.innerHTML="";



try{


let response = await fetch(

"https://users.roblox.com/v1/usernames/users",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

usernames:[username]

})

}

);



let data = await response.json();



if(!data.data || data.data.length === 0){

error.innerHTML="Roblox user not found";

return;

}



let user = data.data[0];





let avatarResponse = await fetch(

`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${user.id}&size=150x150&format=Png`

);



let avatarData = await avatarResponse.json();



let avatar =
avatarData.data[0].imageUrl;





document.getElementById("avatar").src=avatar;

document.getElementById("player").innerHTML=user.name;

document.getElementById("preview").style.display="flex";






localStorage.setItem(

"dreamy_user",

JSON.stringify({

id:user.id,

username:user.name,

avatar:avatar

})

);




if(!localStorage.getItem("dreamy_balance")){

localStorage.setItem(
"dreamy_balance",
"0"
);

}




setTimeout(()=>{

window.location.href="dashboard.html";

},1000);



}


catch(err){


console.log(err);

error.innerHTML=
"Roblox connection failed";


}



}



</script>


</body>

</html>
