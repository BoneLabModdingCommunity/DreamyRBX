<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Dashboard</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top left,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

color:white;

}


.wrapper{

max-width:1400px;

margin:auto;

padding:40px;

display:grid;

grid-template-columns:330px 1fr;

gap:30px;

}



.sidebar,
.main{

background:#111111dd;

border:1px solid #ffffff15;

border-radius:30px;

padding:30px;

}



.logo{

display:flex;

align-items:center;

gap:12px;

font-size:30px;

font-weight:900;

}


.logo img{

width:55px;

}



.avatar{

width:140px;

height:140px;

border-radius:50%;

display:block;

margin:40px auto 20px;

border:4px solid #a855ff;

}



.username{

text-align:center;

font-size:25px;

font-weight:900;

}


.member{

text-align:center;

color:#aaa;

}





.balance{

background:

linear-gradient(
135deg,
#8500ff,
#420080
);

padding:45px;

border-radius:30px;

text-align:center;

box-shadow:0 0 50px #8b00ff70;

}



.balance-title{

opacity:.8;

font-size:18px;

}



.balance-number{

font-size:70px;

font-weight:900;

}



.balance-number img{

width:70px;

vertical-align:middle;

}





.section-title{

font-size:32px;

font-weight:900;

margin-top:35px;

}




.quest-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

margin-top:20px;

}




.quest{

background:#181818;

border-radius:25px;

padding:25px;

border:1px solid #ffffff15;

}



.quest h2{

margin-top:0;

}



.quest p{

color:#aaa;

}



.reward{

color:#c77dff;

font-size:22px;

font-weight:900;

}



button{

margin-top:20px;

padding:15px 30px;

border:0;

border-radius:15px;

background:

linear-gradient(
90deg,
#8b00ff,
#d05cff
);

color:white;

font-weight:900;

cursor:pointer;

}



button:disabled{

opacity:.4;

cursor:not-allowed;

}



.withdraw{

width:100%;

font-size:20px;

padding:20px;

}





@media(max-width:900px){

.wrapper{

grid-template-columns:1fr;

padding:20px;

}


.quest-grid{

grid-template-columns:1fr;

}

.balance-number{

font-size:45px;

}

}



</style>

</head>


<body>


<div class="wrapper">



<div class="sidebar">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<img id="avatar" class="avatar">


<div id="username" class="username">

Loading...

</div>


<div class="member">

Dreamy Member

</div>



</div>







<div class="main">



<div class="balance">


<div class="balance-title">

YOUR RBX BALANCE

</div>



<div class="balance-number">


<img src="https://i.imgur.com/18anndb.png">


<span id="balance">
0
</span>


</div>


</div>







<div class="section-title">

⭐ Quests

</div>



<div id="quests" class="quest-grid">

</div>





<button class="withdraw" onclick="location.href='withdraw.html'">

💸 Withdraw RBX

</button>




</div>


</div>







<script>


const MAX_RBX = 200;



let user =
JSON.parse(localStorage.getItem("dreamy_user"));



if(!user){

location.href="index.html";

}



document.getElementById("avatar").src =
user.avatar;


document.getElementById("username").innerHTML =
"@" + user.username;





let balance =
Number(localStorage.getItem("dreamy_balance") || 0);





function update(){

document.getElementById("balance").innerHTML =
balance;


localStorage.setItem(
"dreamy_balance",
balance
);

}



update();







const questPool=[


{
title:"Watch KreekCraft Video",
desc:"Watch the KreekCraft Roblox video until the end.",
reward:15,
video:"https://www.youtube.com/embed/WWXU9rMJEtw"
},


{
title:"Daily Login",
desc:"Open Dreamy RBX today.",
reward:10
},


{
title:"Visit Dreamy RBX",
desc:"Explore the website.",
reward:5
},


{
title:"Play Roblox",
desc:"Play Roblox for 10 minutes.",
reward:20
},


{
title:"Complete Profile",
desc:"Keep your Roblox account connected.",
reward:25
},


{
title:"Invite Friend",
desc:"Tell a friend about Dreamy RBX.",
reward:15
}


];







let quests =
questPool
.sort(()=>Math.random()-0.5)
.slice(0,4);







function loadQuests(){


let box=document.getElementById("quests");


box.innerHTML="";



quests.forEach(q=>{


let id =
"quest_" + q.title.replaceAll(" ","_");



let done =
localStorage.getItem(id);



box.innerHTML += `


<div class="quest">


<h2>${q.title}</h2>


<p>${q.desc}</p>


<div class="reward">

+${q.reward} RBX

</div>



<button

onclick="${
q.video
?
`watchVideo('${id}',${q.reward},this,'${q.video}')`
:
`completeQuest('${id}',${q.reward},this)`
}"

${done ? "disabled":""}

>

${done ? "Completed":"Claim"}

</button>



</div>


`;


});


}








function completeQuest(id,reward,button){


if(localStorage.getItem(id))
return;



if(balance + reward > MAX_RBX){

alert(
"You reached the 200 RBX limit. Withdraw first!"
);

return;

}



balance += reward;



localStorage.setItem(
id,
"true"
);



button.disabled=true;

button.innerHTML="Completed";


update();


}









function watchVideo(id,reward,button,video){



let win=window.open(
"",
"_blank",
"width=1000,height=700"
);



win.document.write(`

<html>

<body style="
background:#111;
color:white;
text-align:center;
font-family:Arial;
">


<h1>
Watch KreekCraft Video
</h1>


<iframe

width="900"

height="500"

src="${video}"

allowfullscreen>

</iframe>



<br><br>


<button onclick="

window.opener.completeQuest(
'${id}',
${reward},
window.opener.document.querySelector('button')
);

window.close();

"

style="
padding:15px;
background:#9b00ff;
color:white;
border:0;
border-radius:10px;
">

I Finished Watching

</button>


</body>

</html>

`);


}






loadQuests();


</script>


</body>

</html>
