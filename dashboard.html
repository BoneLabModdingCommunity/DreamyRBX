<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Dashboard</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top left,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

color:white;

}


.wrapper{

max-width:1400px;
margin:auto;
padding:40px;

display:grid;

grid-template-columns:330px 1fr;

gap:30px;

}



.sidebar,
.main{

background:#111111cc;

border:1px solid #ffffff15;

border-radius:30px;

padding:30px;

}



.logo{

display:flex;

align-items:center;

gap:12px;

font-size:30px;

font-weight:900;

}



.logo img{

width:55px;

}



.avatar{

width:140px;

height:140px;

border-radius:50%;

display:block;

margin:40px auto 20px;

border:4px solid #a855ff;

}



.username{

text-align:center;

font-size:25px;

font-weight:900;

}



.member{

text-align:center;

color:#aaa;

}





.balance{

background:

linear-gradient(
135deg,
#8500ff,
#420080
);

border-radius:30px;

padding:45px;

text-align:center;

box-shadow:0 0 50px #8b00ff55;

}



.balance-title{

opacity:.8;

}



.balance-number{

font-size:70px;

font-weight:900;

}



.balance-number img{

width:65px;

vertical-align:middle;

}




.section-title{

font-size:32px;

font-weight:900;

margin-top:35px;

}




.quest-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

margin-top:20px;

}



.quest{

background:#181818;

border:1px solid #ffffff12;

border-radius:25px;

padding:25px;

}



.quest h2{

margin-top:0;

}



.quest p{

color:#aaa;

}



.reward{

color:#c77dff;

font-size:22px;

font-weight:900;

}



button{

margin-top:20px;

background:linear-gradient(
90deg,
#8b00ff,
#d05cff
);

border:none;

color:white;

font-weight:900;

padding:15px 30px;

border-radius:15px;

cursor:pointer;

}



button:hover{

transform:scale(1.05);

}



button:disabled{

opacity:.4;

transform:none;

}



.withdraw{

width:100%;

font-size:20px;

padding:20px;

}





@media(max-width:900px){

.wrapper{

grid-template-columns:1fr;

padding:20px;

}

.quest-grid{

grid-template-columns:1fr;

}

.balance-number{

font-size:45px;

}

}


</style>

</head>


<body>



<div class="wrapper">



<div class="sidebar">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<img id="avatar" class="avatar">



<div id="username" class="username">
Loading...
</div>


<div class="member">
Dreamy Member
</div>



</div>







<div class="main">



<div class="balance">


<div class="balance-title">
YOUR RBX BALANCE
</div>


<div class="balance-number">

<img src="https://i.imgur.com/18anndb.png">

<span id="balance">
0
</span>

</div>


</div>






<div class="section-title">

⭐ Quests

</div>



<div class="quest-grid" id="quests">

</div>





<button class="withdraw" onclick="location.href='withdraw.html'">

💸 Withdraw RBX

</button>




</div>



</div>








<script>



let user =
JSON.parse(localStorage.getItem("dreamy_user"));



if(!user){

location.href="index.html";

}



document.getElementById("avatar").src =
user.avatar;



document.getElementById("username").innerHTML =
"@" + user.username;





let balance =
Number(localStorage.getItem("dreamy_balance") || 0);



function update(){

document.getElementById("balance").innerHTML =
balance;


localStorage.setItem(
"dreamy_balance",
balance
);

}



update();






const questPool = [


{
title:"Watch A Video",
desc:"Watch a Dreamy RBX video until the end.",
reward:15
},


{
title:"Daily Login",
desc:"Open Dreamy RBX today.",
reward:10
},


{
title:"Visit Website",
desc:"Spend time exploring Dreamy RBX.",
reward:5
},


{
title:"Play Roblox",
desc:"Play Roblox for 10 minutes.",
reward:20
},


{
title:"Complete Profile",
desc:"Keep your Roblox account connected.",
reward:25
},


{
title:"Invite Friend",
desc:"Share Dreamy RBX with someone.",
reward:15
},


{
title:"Check Updates",
desc:"Look at the latest Dreamy RBX news.",
reward:10
}


];





let quests =
questPool
.sort(()=>Math.random()-0.5)
.slice(0,4);







function loadQuests(){


let box =
document.getElementById("quests");



box.innerHTML="";



quests.forEach((q,index)=>{


let id =
"quest_" + q.title.replaceAll(" ","_");



let done =
localStorage.getItem(id);



box.innerHTML += `

<div class="quest">


<h2>
${q.title}
</h2>


<p>
${q.desc}
</p>


<div class="reward">
+${q.reward} RBX
</div>



<button 
onclick="completeQuest('${id}',${q.reward},this)"
${done ? "disabled":""}
>

${done ? "Completed":"Claim"}

</button>



</div>

`;

});


}







function completeQuest(id,reward,button){



if(localStorage.getItem(id)) return;



balance += reward;



localStorage.setItem(
id,
"true"
);



button.disabled=true;

button.innerHTML="Completed";



update();


}





loadQuests();



</script>


</body>

</html>
