<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Dashboard</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');


*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(circle at top left,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

color:white;

}





.wrapper{

max-width:1400px;

margin:auto;

padding:40px;

display:grid;

grid-template-columns:330px 1fr;

gap:30px;

}





.sidebar{

background:#111111cc;

border:1px solid #ffffff15;

border-radius:30px;

padding:30px;

height:fit-content;

}



.logo{

display:flex;

align-items:center;

gap:12px;

font-size:30px;

font-weight:900;

margin-bottom:35px;

}


.logo img{

width:55px;

}



.avatar{

width:130px;

height:130px;

border-radius:50%;

border:4px solid #a855ff;

display:block;

margin:auto;

}



.username{

text-align:center;

font-size:25px;

font-weight:900;

margin-top:15px;

}



.member{

text-align:center;

color:#aaa;

}



.main{


background:#111111aa;

border-radius:30px;

padding:35px;

border:1px solid #ffffff15;

}





.balance{


background:

linear-gradient(
135deg,
#8500ff,
#420080
);


padding:45px;

border-radius:30px;

text-align:center;

box-shadow:0 0 50px #8b00ff55;

}



.balance-title{

font-size:18px;

opacity:.8;

}



.balance-number{

font-size:70px;

font-weight:900;

margin-top:15px;

}



.balance-number img{

width:70px;

vertical-align:middle;

}





.section-title{

font-size:30px;

font-weight:900;

margin-top:35px;

}





.quest-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

margin-top:20px;

}





.quest{


background:#181818;

border-radius:25px;

padding:30px;

border:1px solid #ffffff12;


}



.quest h2{

margin:0;

}



.reward{

color:#c77dff;

font-size:22px;

font-weight:900;

}



.quest p{

color:#aaa;

}





button{


background:

linear-gradient(
90deg,
#8b00ff,
#d05cff
);


border:0;

color:white;

font-size:16px;

font-weight:900;

padding:15px 30px;

border-radius:15px;

cursor:pointer;

}



button:hover{

transform:scale(1.03);

}



button:disabled{

opacity:.4;

transform:none;

}



.withdraw{

margin-top:30px;

width:100%;

padding:20px;

font-size:20px;

}





@media(max-width:900px){


.wrapper{

grid-template-columns:1fr;

padding:20px;

}


.quest-grid{

grid-template-columns:1fr;

}


.balance-number{

font-size:45px;

}


}



</style>

</head>



<body>



<div class="wrapper">





<div class="sidebar">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<img id="avatar" class="avatar">


<div id="username" class="username">
Loading...
</div>


<div class="member">
Dreamy Member
</div>


</div>







<div class="main">



<div class="balance">


<div class="balance-title">

YOUR AVAILABLE RBX

</div>



<div class="balance-number">

<img src="https://i.imgur.com/18anndb.png">

<span id="balance">
0
</span>

</div>


</div>






<div class="section-title">

⭐ Daily Quests

</div>





<div class="quest-grid">





<div class="quest">

<h2>
Visit Dreamy RBX
</h2>


<p>
Open the website today.
</p>


<div class="reward">
+5 RBX
</div>


<br>


<button id="visit" onclick="claim('visit',5)">
Claim
</button>


</div>







<div class="quest">


<h2>
Daily Login
</h2>


<p>
Come back every day.
</p>


<div class="reward">
+10 RBX
</div>


<br>


<button id="daily" onclick="daily()">
Claim
</button>


</div>







<div class="quest">


<h2>
Complete Profile
</h2>


<p>
Connect your Roblox username.
</p>


<div class="reward">
+25 RBX
</div>


<br>


<button id="profile" onclick="claim('profile',25)">
Claim
</button>


</div>






<div class="quest">


<h2>
Future Quest
</h2>


<p>
More rewards coming soon.
</p>


<div class="reward">
+50 RBX
</div>


<br>


<button disabled>
Locked
</button>


</div>





</div>





<button class="withdraw" onclick="location.href='withdraw.html'">

💸 Withdraw RBX

</button>




</div>



</div>







<script>


let user =
JSON.parse(localStorage.getItem("dreamy_user"));



if(!user){

location.href="index.html";

}



avatar.src=user.avatar;

username.innerHTML="@"+user.username;





let balance =
Number(localStorage.getItem("dreamy_balance")||0);



function update(){

document.getElementById("balance").innerHTML=balance;

localStorage.setItem(
"dreamy_balance",
balance
);

}



update();






function claim(id,amount){


if(localStorage.getItem(id)){

return;

}



balance+=amount;


localStorage.setItem(id,true);


document.getElementById(id).disabled=true;

document.getElementById(id).innerHTML="Completed";


update();


}






function daily(){


let today=new Date().toDateString();


if(localStorage.getItem("daily")===today){

return;

}



balance+=10;


localStorage.setItem("daily",today);


document.getElementById("daily").disabled=true;

document.getElementById("daily").innerHTML="Claimed";


update();


}



</script>


</body>

</html>
