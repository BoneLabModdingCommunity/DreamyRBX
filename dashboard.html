<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}

body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#b000ff55,transparent 35%),
linear-gradient(135deg,#050505,#21003b);

color:white;

display:flex;
justify-content:center;

}


.container{

width:100%;
max-width:500px;

padding:25px;

}



/* TOP PROFILE */

.profile{

background:rgba(20,20,30,.8);

border:1px solid #ffffff20;

border-radius:25px;

padding:20px;

display:flex;

align-items:center;

gap:15px;

backdrop-filter:blur(20px);

}



.profile img{

width:75px;
height:75px;

border-radius:50%;

border:3px solid #a855ff;

}



.name{

font-size:22px;
font-weight:900;

}





/* BALANCE */


.balance{

margin-top:25px;

padding:35px 20px;

border-radius:30px;

text-align:center;

background:

linear-gradient(
135deg,
#8500ff,
#430080
);

box-shadow:

0 0 40px #8b00ff80;

}



.balance img{

width:55px;

vertical-align:middle;

}



.balance h1{

font-size:48px;

margin:10px 0 0;

font-weight:900;

}





.small{

opacity:.75;

}





/* CARDS */


.card{

margin-top:25px;

background:

rgba(15,15,20,.9);

border-radius:25px;

padding:20px;

border:1px solid #ffffff15;

}



.title{

font-size:22px;

font-weight:900;

}





.quest{

margin-top:15px;

padding:20px;

border-radius:18px;

background:#0b0b0b;

display:flex;

justify-content:space-between;

align-items:center;

border:1px solid #ffffff12;

}



.quest b{

font-size:17px;

}



.reward{

color:#b66cff;

font-weight:bold;

}



button{

background:

linear-gradient(
90deg,
#9b00ff,
#d05cff
);

color:white;

border:0;

padding:12px 20px;

border-radius:14px;

font-weight:900;

cursor:pointer;

}



button:disabled{

opacity:.4;

cursor:not-allowed;

}



.withdraw{

width:100%;

margin-top:20px;

padding:17px;

font-size:17px;

}





.logo{

display:flex;

align-items:center;

justify-content:center;

gap:8px;

font-weight:900;

font-size:25px;

}



.logo img{

width:35px;

}



</style>

</head>



<body>


<div class="container">



<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>





<div class="profile">

<img id="avatar">

<div>

<div class="name" id="username">
Loading...
</div>

<div class="small">
Dreamy Member
</div>

</div>

</div>





<div class="balance">


<div class="small">
YOUR RBX BALANCE
</div>


<h1>

<img src="https://i.imgur.com/18anndb.png">

<span id="balance">
0
</span>

</h1>


</div>







<div class="card">


<div class="title">

⭐ Quests

</div>



<div class="quest">


<div>

<b>
Click This
</b>

<br>

<span class="reward">
+5 RBX
</span>

</div>


<button id="clickQuest" onclick="clickQuest()">

Claim

</button>


</div>





<div class="quest">


<div>

<b>
Daily Reward
</b>

<br>

<span class="reward">
+10 RBX
</span>

</div>


<button id="dailyQuest" onclick="dailyReward()">

Claim

</button>


</div>



</div>







<div class="card">


<div class="title">
💸 Withdraw
</div>


<p class="small">
Use your earned RBX points for rewards.
</p>


<button class="withdraw" onclick="location.href='withdraw.html'">

Withdraw

</button>


</div>




</div>






<script>


let user =
JSON.parse(localStorage.getItem("dreamy_user"));



if(!user){

location.href="index.html";

}



document.getElementById("avatar").src=user.avatar;

document.getElementById("username").innerHTML=
"@" + user.username;





let balance =
Number(localStorage.getItem("dreamy_balance") || 0);



function update(){

document.getElementById("balance").innerHTML=
balance;

localStorage.setItem(
"dreamy_balance",
balance
);

}



update();






function clickQuest(){


if(localStorage.getItem("click_done")){

return;

}


balance += 5;


localStorage.setItem(
"click_done",
"true"
);


document.getElementById("clickQuest").disabled=true;

document.getElementById("clickQuest").innerHTML="Done";


update();


}







function dailyReward(){


let today =
new Date().toDateString();



if(localStorage.getItem("daily")===today){

return;

}



balance += 10;


localStorage.setItem(
"daily",
today
);


document.getElementById("dailyQuest").disabled=true;

document.getElementById("dailyQuest").innerHTML="Claimed";


update();


}






if(localStorage.getItem("click_done")){

document.getElementById("clickQuest").disabled=true;

document.getElementById("clickQuest").innerHTML="Done";

}



if(localStorage.getItem("daily")===new Date().toDateString()){

document.getElementById("dailyQuest").disabled=true;

document.getElementById("dailyQuest").innerHTML="Claimed";

}


</script>



</body>

</html>
