<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top left,#9b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

color:white;

}



.wrapper{

max-width:1400px;
margin:auto;
padding:40px;

display:grid;

grid-template-columns:330px 1fr;

gap:30px;

}



.card{

background:#111111dd;

border-radius:30px;

padding:30px;

border:1px solid #ffffff15;

}



.logo{

font-size:30px;

font-weight:900;

display:flex;

align-items:center;

gap:12px;

}



.logo img{

width:55px;

}



.avatar{

width:150px;

height:150px;

border-radius:50%;

display:block;

margin:40px auto 20px;

border:4px solid #a855ff;

}



.username{

text-align:center;

font-size:28px;

font-weight:900;

}



.balance{

background:

linear-gradient(
135deg,
#8500ff,
#420080
);

padding:40px;

border-radius:30px;

text-align:center;

}



.balance img{

width:60px;

vertical-align:middle;

}



.number{

font-size:70px;

font-weight:900;

}



.title{

font-size:32px;

font-weight:900;

margin-top:35px;

}



.quests{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

margin-top:20px;

}



.quest{

background:#181818;

padding:25px;

border-radius:25px;

}



.reward{

color:#c77dff;

font-size:22px;

font-weight:900;

}



button{

margin-top:20px;

width:100%;

padding:16px;

border:0;

border-radius:15px;

background:linear-gradient(
90deg,
#8b00ff,
#d05cff
);

color:white;

font-weight:900;

cursor:pointer;

}



button:disabled{

opacity:.4;

}



@media(max-width:900px){

.wrapper{

grid-template-columns:1fr;

}


.quests{

grid-template-columns:1fr;

}

}

</style>

</head>



<body>


<div class="wrapper">



<div class="card">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<img id="avatar" class="avatar">



<div id="username" class="username">

Loading...

</div>


</div>







<div class="card">



<div class="balance">


<div>
YOUR BALANCE
</div>


<div class="number">

<img src="https://i.imgur.com/18anndb.png">

<span id="balance">
0
</span>

</div>


</div>





<div class="title">
⭐ Quests
</div>


<div class="quests" id="quests">

</div>




<button onclick="location.href='withdraw.html'">

💸 Withdraw

</button>



</div>




</div>









<script>


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




let user =
JSON.parse(
localStorage.getItem("dreamy_user")
);



if(!user){

location.href="index.html";

}







async function loadUser(){


let {data,error}=await db

.from("users")

.select("*")

.eq("username",user.username)

.single();





if(error){

console.log(error);

return;

}





document.getElementById("username").innerHTML =
"@"+data.username;



document.getElementById("avatar").src =
data.avatar;



document.getElementById("balance").innerHTML =
data.balance;



localStorage.setItem(
"dreamy_user",
JSON.stringify(data)
);



}





const quests=[


["Watch KreekCraft Video",15],

["Daily Login",10],

["Visit Dreamy RBX",5],

["Play Roblox",20]

];






function loadQuests(){


let box=document.getElementById("quests");


box.innerHTML="";



quests.forEach(q=>{


box.innerHTML+=`

<div class="quest">

<h2>${q[0]}</h2>

<p>

Complete this quest

</p>


<div class="reward">

+${q[1]} RBX

</div>


<button>

Claim

</button>


</div>

`;

});


}





loadUser();

loadQuests();



</script>


</body>

</html>
