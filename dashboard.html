<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');

*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#8b00ff55,transparent 40%),
linear-gradient(135deg,#050505,#18002b);

color:white;

}


.container{

max-width:1400px;
margin:auto;
padding:40px;

display:grid;

grid-template-columns:350px 1fr;

gap:30px;

}



.card{

background:#111;

border-radius:30px;

padding:35px;

box-shadow:0 0 40px #000;

}



.logo{

font-size:30px;

font-weight:900;

display:flex;

align-items:center;

gap:15px;

}



.logo img{

width:55px;

}



.avatar{

width:170px;

height:170px;

border-radius:50%;

display:block;

margin:40px auto 20px;

border:5px solid #a855ff;

}



.username{

text-align:center;

font-size:30px;

font-weight:900;

}



.balance{

padding:35px;

border-radius:25px;

background:linear-gradient(
135deg,
#8500ff,
#430080
);

text-align:center;

font-size:20px;

}



.balance img{

width:55px;

vertical-align:middle;

}



.amount{

font-size:65px;

font-weight:900;

}



h1{

font-size:35px;

}



.quests{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}



.quest{

background:#191919;

padding:25px;

border-radius:25px;

}



.reward{

color:#c77dff;

font-size:22px;

font-weight:900;

}



button{

width:100%;

padding:16px;

margin-top:20px;

border:0;

border-radius:15px;

background:linear-gradient(
90deg,#8b00ff,#d05cff
);

color:white;

font-weight:900;

font-size:18px;

cursor:pointer;

}



button:disabled{

background:#333;

color:#777;

}



.withdraw{

margin-top:30px;

}



@media(max-width:900px){

.container{

grid-template-columns:1fr;

}


.quests{

grid-template-columns:1fr;

}

}


</style>

</head>


<body>



<div class="container">


<div class="card">


<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX

</div>



<img id="avatar" class="avatar">



<div id="username" class="username">

Loading...

</div>



</div>





<div class="card">



<div class="balance">

Your Balance

<br>


<img src="https://i.imgur.com/18anndb.png">


<span class="amount" id="balance">
0
</span>

RBX


</div>




<h1>
⭐ Quests
</h1>



<div id="quests" class="quests"></div>



<button class="withdraw" onclick="location.href='withdraw.html'">

Withdraw RBX

</button>



</div>


</div>








<script>


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let user =
JSON.parse(
localStorage.getItem("dreamy_user")
);



if(!user){

location.href="index.html";

}




let currentUser;





async function loadUser(){


let {data,error}=await db

.from("users")

.select("*")

.eq("username",user.username)

.single();




if(error){

console.log(error);

return;

}



currentUser=data;



document.getElementById("username").innerHTML =
"@"+data.username;


document.getElementById("avatar").src =
data.avatar;


document.getElementById("balance").innerHTML =
data.balance;



if(!data.claimed_quests){

await db

.from("users")

.update({

claimed_quests:[]

})

.eq("username",data.username);


currentUser.claimed_quests=[];

}


loadQuests();


}







const allQuests=[


{
id:"daily",
name:"Daily Reward",
reward:10
},


{
id:"video",
name:"Watch KreekCraft Video",
reward:15
},


{
id:"visit",
name:"Visit Dreamy RBX",
reward:5
},


{
id:"roblox",
name:"Play Roblox",
reward:20
},


{
id:"community",
name:"Join Community",
reward:10
}



];





let shown=[];



function loadQuests(){



shown =
allQuests
.sort(()=>Math.random()-0.5)
.slice(0,4);



let box =
document.getElementById("quests");



box.innerHTML="";



shown.forEach(q=>{



let claimed =
currentUser.claimed_quests.includes(q.id);



box.innerHTML += `

<div class="quest">

<h2>${q.name}</h2>


<p>
Complete this quest
</p>


<div class="reward">

+${q.reward} RBX

</div>


<button

${claimed?"disabled":""}

onclick="claim('${q.id}',${q.reward})">

${claimed?"Claimed":"Claim"}

</button>


</div>

`;

});


}








async function claim(id,reward){



let balance =
currentUser.balance;



if(balance >= 200){

alert("Balance limit reached");

return;

}




let newBalance =
Math.min(
200,
balance+reward
);




let claimed =
currentUser.claimed_quests || [];



claimed.push(id);






let {error}=await db

.from("users")

.update({

balance:newBalance,

claimed_quests:claimed

})

.eq("username",currentUser.username);






if(error){

alert(error.message);

return;

}




currentUser.balance=newBalance;

currentUser.claimed_quests=claimed;



document.getElementById("balance").innerHTML =
newBalance;


loadQuests();



}



loadUser();



</script>



</body>

</html>
