<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dreamy RBX Admin</title>

<script src="../supabase.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');


*{
box-sizing:border-box;
font-family:Inter,Arial;
}


body{

margin:0;

min-height:100vh;

background:
linear-gradient(135deg,#050505,#260044);

color:white;

display:flex;

justify-content:center;

align-items:center;

}



.box{

width:600px;

background:#111;

padding:40px;

border-radius:30px;

box-shadow:0 0 50px #8b00ff55;

}



.logo{

font-size:35px;

font-weight:900;

text-align:center;

}



.logo img{

width:60px;

vertical-align:middle;

}



input{

width:100%;

padding:18px;

margin-top:15px;

border-radius:15px;

border:1px solid #333;

background:#080808;

color:white;

font-size:18px;

}



button{

width:100%;

padding:18px;

margin-top:20px;

border:0;

border-radius:15px;

background:linear-gradient(
90deg,
#8b00ff,
#d05cff
);

color:white;

font-weight:900;

font-size:18px;

cursor:pointer;

}



button:hover{

transform:scale(1.03);

}



#panel{

display:none;

}



.status{

margin-top:20px;

text-align:center;

color:#c77dff;

font-weight:bold;

}

</style>

</head>


<body>



<div class="box">



<div class="logo">

<img src="https://i.imgur.com/18anndb.png">

Dreamy RBX Admin

</div>




<div id="login">


<input

id="password"

placeholder="Admin Password"

type="password">


<button onclick="login()">

Login

</button>


</div>






<div id="panel">


<h2>
Give / Remove RBX
</h2>



<input

id="username"

placeholder="Username">



<input

id="amount"

placeholder="Amount"

type="number">



<button onclick="changeRBX(1)">

➕ Give RBX

</button>



<button onclick="changeRBX(-1)">

➖ Remove RBX

</button>



<div class="status" id="status"></div>



</div>



</div>







<script>


// CHANGE THIS PASSWORD

const ADMIN_PASSWORD =
"DreamyAdmin123";





const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





function login(){


let pass =
document.getElementById("password").value;



if(pass === ADMIN_PASSWORD){


document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";


}

else{

alert("Wrong password");

}


}








async function changeRBX(mult){


let username =
document.getElementById("username").value.trim();



let amount =
Number(document.getElementById("amount").value);



if(!username || !amount){

alert("Fill everything");

return;

}





let {data,error}=await supabaseClient

.from("users")

.select("balance")

.eq("username",username)

.single();





if(error){

document.getElementById("status").innerHTML=
"User not found";

return;

}





let newBalance =
data.balance + (amount * mult);





if(newBalance < 0){

newBalance=0;

}





let update =
await supabaseClient

.from("users")

.update({

balance:newBalance

})

.eq("username",username);





document.getElementById("status").innerHTML=

"Updated "+username+
" balance to "+newBalance+" RBX";


}




</script>


</body>

</html>
